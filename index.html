<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GREENFIELD — 아마추어 골프 랭킹</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B1F17">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>


:root{
  --pine:#0B1F17; --pine-2:#12291F; --pine-3:#1C3B2D;
  --paper:#F7F5EE; --paper-2:#EEEADC; --paper-3:#E4DFCD;
  --red:#C8452F; --brass:#C9A961; --brass-soft:#E4D3A4;
  --ink:#101A15; --sub:#5C6B60; --mist:#8FA396;
  --line:rgba(16,26,21,.10); --line-d:rgba(247,245,238,.12);
  --r:16px;
  --app-h:min(884px, calc(100vh - 40px));
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 700px at 12% -10%, #1B3A2C 0%, transparent 60%),
    radial-gradient(900px 600px at 100% 100%, #16302a 0%, transparent 55%),
    #071410;
  color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px; line-height:1.5; letter-spacing:-.01em;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:20px; gap:56px;
  -webkit-font-smoothing:antialiased;
}
/* ---------- desktop rail ---------- */
.rail{width:352px; color:var(--paper); display:none; flex:0 0 auto}
.rail .mark{display:flex; align-items:baseline; gap:10px}
.rail .mark b{font-family:'Barlow Condensed',sans-serif; font-size:30px; letter-spacing:.14em; font-weight:600}
.rail .mark span{font-size:11px; letter-spacing:.22em; color:var(--brass); text-transform:uppercase}
.rail h1{font-family:'Noto Serif KR',serif; font-weight:700; font-size:29px; line-height:1.42; letter-spacing:-.02em; margin:26px 0 0}
.rail h1 em{font-style:normal; color:var(--brass-soft)}
.rail p.lede{color:#A9BBAF; font-size:13.5px; line-height:1.75; margin:14px 0 0}
.rail .rules{margin-top:30px; border-top:1px solid var(--line-d); padding-top:6px}
.rail .rule{padding:16px 0; border-bottom:1px solid var(--line-d); display:grid; grid-template-columns:22px 1fr; gap:12px}
.rail .rule i{font-family:'Barlow Condensed',sans-serif; font-style:normal; font-size:13px; color:var(--brass); letter-spacing:.08em; padding-top:2px}
.rail .rule b{display:block; font-size:13px; font-weight:600; margin-bottom:4px; letter-spacing:.01em}
.rail .rule p{margin:0; font-size:12px; color:#93A79B; line-height:1.65}
.rail .legacy{margin-top:22px; font-size:11.5px; color:#7C9084; line-height:1.7}
.rail .legacy b{color:var(--brass); font-weight:600}
@media(min-width:1080px){ .rail{display:block} }

/* ---------- device ---------- */
.device{
  position:relative; width:430px; max-width:100%; height:var(--app-h);
  background:var(--pine); border-radius:44px; overflow:hidden;
  box-shadow:0 40px 90px -20px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.07), 0 0 0 10px #0A1712;
  display:flex; flex-direction:column;
}
.statusbar{height:44px; flex:0 0 44px; display:flex; align-items:center; justify-content:space-between; padding:0 26px 0 30px; color:var(--paper); font-size:12.5px; font-weight:600; letter-spacing:.02em; background:var(--pine)}
.statusbar .dots{display:flex; gap:5px; align-items:center; opacity:.85}
.statusbar .dots i{display:block; width:5px; height:5px; border-radius:50%; background:var(--paper)}
.statusbar .dots i:nth-child(2){opacity:.6}
.statusbar .dots i:nth-child(3){opacity:.3}

.appbar{
  flex:0 0 auto; padding:6px 20px 14px; background:var(--pine); color:var(--paper);
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.appbar .ttl{font-size:11px; letter-spacing:.2em; color:var(--mist); text-transform:uppercase}
.appbar .who{display:flex; align-items:center; gap:9px}
.appbar .who .nm{font-weight:600; font-size:14.5px}
.appbar .who .no{font-family:'Barlow Condensed',sans-serif; font-size:11.5px; letter-spacing:.1em; color:var(--brass); border:1px solid rgba(201,169,97,.4); border-radius:999px; padding:2px 7px}
.appbar .ic{width:34px; height:34px; border-radius:50%; border:1px solid var(--line-d); display:grid; place-items:center; background:transparent; color:var(--paper); cursor:pointer; font-size:14px}
.appbar .ic:active{transform:scale(.94)}

main#screen{
  flex:1 1 auto; overflow-y:auto; overflow-x:hidden; background:var(--paper);
  padding:0 0 24px; scrollbar-width:none; overscroll-behavior:contain;
  position:relative;
}
main#screen::-webkit-scrollbar{display:none}
main#screen.dark{background:var(--pine)}

.tabbar{
  flex:0 0 auto; display:grid; grid-template-columns:repeat(5,1fr);
  background:var(--pine-2); border-top:1px solid rgba(255,255,255,.06); padding:8px 6px 14px;
}
.tabbar button{
  background:none; border:0; color:#7E9287; font-family:inherit; font-size:10.5px; font-weight:600;
  display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding:6px 0 2px; letter-spacing:.01em;
  position:relative; transition:color .18s;
}
.tabbar button svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; opacity:.55; transition:opacity .18s}
.tabbar button.on{color:var(--paper)}
.tabbar button.on svg{opacity:1}
.appbar .ic svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px}
.tabbar button.on::after{content:""; position:absolute; top:-9px; width:16px; height:2px; background:var(--brass); border-radius:2px}
.tabbar button:active{transform:translateY(1px)}

/* ---------- primitives ---------- */
.pad{padding:0 18px}
.card{background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:18px}
.card.paper{background:var(--paper)}
.card.pine{background:var(--pine-2); border-color:rgba(255,255,255,.08); color:var(--paper)}
.eyebrow{font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--sub); font-weight:700}
.eyebrow.br{color:var(--brass)}
.h1{font-family:'Noto Serif KR',serif; font-weight:700; font-size:25px; line-height:1.45; letter-spacing:-.03em; margin:10px 0 0}
.h2{font-family:'Noto Serif KR',serif; font-weight:700; font-size:18px; letter-spacing:-.02em; margin:0}
.muted{color:var(--sub); font-size:13px; line-height:1.65}
.num{font-family:'Barlow Condensed',sans-serif; font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:.01em}
.divider{height:1px; background:var(--line); margin:16px 0}
.chip{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:999px; padding:4px 9px; font-size:11px; font-weight:600; color:var(--sub); background:#fff}
.chip.solid{background:var(--pine); color:var(--paper); border-color:var(--pine)}
.chip.gold{color:#8C6B2A; border-color:rgba(201,169,97,.5); background:rgba(201,169,97,.1)}
.chip.red{color:var(--red); border-color:rgba(200,69,47,.3); background:rgba(200,69,47,.07)}

.btn{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  border:0; border-radius:13px; padding:16px 18px; font-family:inherit; font-size:15px; font-weight:700;
  background:var(--pine); color:var(--paper); cursor:pointer; letter-spacing:-.01em;
  transition:transform .12s, background .15s;
}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent; color:var(--pine); border:1px solid var(--line); font-weight:600}
.btn.gold{background:var(--brass); color:#231A08}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none}
.btn.sm{padding:11px 14px; font-size:13px; border-radius:11px; width:auto}
.link{background:none;border:0;padding:0;font-family:inherit;font-size:12.5px;color:var(--sub);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

input,select{
  width:100%; font-family:inherit; font-size:15px; color:var(--ink); background:#fff;
  border:1px solid var(--line); border-radius:12px; padding:14px 14px; outline:none; transition:border .15s, box-shadow .15s;
}
input:focus,select:focus{border-color:var(--pine); box-shadow:0 0 0 3px rgba(11,31,23,.07)}
label.fld{display:block; margin-bottom:14px}
label.fld > span{display:block; font-size:11.5px; font-weight:700; color:var(--sub); margin-bottom:7px; letter-spacing:.02em}
.err{color:var(--red); font-size:12px; margin-top:6px; display:none}
.err.on{display:block}

/* ---------- welcome ---------- */
.welcome{padding:26px 22px 30px; background:var(--pine); color:var(--paper); min-height:100%}
.welcome .wm{font-family:'Barlow Condensed',sans-serif; font-size:17px; letter-spacing:.3em; font-weight:600; color:var(--paper)}
.welcome .wm span{color:var(--brass)}
.welcome .hero{margin-top:34px}
.welcome .hero h1{font-family:'Noto Serif KR',serif; font-size:35px; line-height:1.4; font-weight:700; letter-spacing:-.035em; margin:0}
.welcome .hero h1 em{font-style:normal; color:var(--brass-soft)}
.welcome .hero p{color:#9FB3A7; font-size:13.5px; line-height:1.8; margin:16px 0 0; max-width:310px}
.band{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; margin-top:30px; border:1px solid rgba(255,255,255,.12); border-radius:12px; overflow:hidden; background:rgba(255,255,255,.12)}
.band div{background:#0F2620; padding:12px 10px 14px}
.band b{display:block; font-family:'Barlow Condensed',sans-serif; font-size:19px; letter-spacing:.04em}
.band span{font-size:9.5px; color:#7E9287; letter-spacing:.06em}
.band div:nth-child(1) b{color:var(--brass)}
.wsteps{margin-top:26px; display:grid; gap:1px; background:rgba(255,255,255,.1); border-radius:12px; overflow:hidden}
.wstep{background:#0F2620; padding:14px 16px; display:flex; gap:12px; align-items:flex-start}
.wstep b{font-family:'Barlow Condensed',sans-serif; font-size:12px; color:var(--brass); letter-spacing:.1em; padding-top:1px}
.wstep .t{font-size:13.5px; font-weight:600; letter-spacing:-.01em}
.wstep .d{font-size:11.5px; color:#7E9287; margin-top:2px; line-height:1.55}
.welcome .cta{margin-top:26px}
.welcome .foot{margin-top:14px; text-align:center; font-size:11px; color:#6C8074}

/* ---------- signup ---------- */
.signup{padding:22px 20px 30px; min-height:100%}
.sprog{display:flex; gap:6px; margin-bottom:22px}
.sprog i{flex:1; height:3px; border-radius:3px; background:var(--paper-3)}
.sprog i.on{background:var(--pine)}
.sprog i.done{background:var(--brass)}
.step-title{font-family:'Noto Serif KR',serif; font-size:21px; font-weight:700; letter-spacing:-.03em; margin:0 0 6px}
.step-sub{font-size:12.5px; color:var(--sub); margin:0 0 22px; line-height:1.6}
.codebox{display:flex; gap:8px; margin-bottom:6px}
.codebox input{text-align:center; font-family:'Barlow Condensed',sans-serif; font-size:26px; padding:12px 0; letter-spacing:.1em}
.hint{background:rgba(201,169,97,.12); border:1px solid rgba(201,169,97,.35); border-radius:10px; padding:10px 12px; font-size:11.5px; color:#7A5C1E; display:flex; justify-content:space-between; align-items:center; gap:8px; margin:12px 0}
.hint button{border:0;background:none;font-family:inherit;font-weight:700;font-size:11.5px;color:#7A5C1E;text-decoration:underline;cursor:pointer;padding:0}
.hcp-set{display:flex; align-items:center; gap:16px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px}
.hcp-set .big{font-family:'Barlow Condensed',sans-serif; font-size:42px; line-height:1; min-width:76px; letter-spacing:.02em}
.hcp-set .big small{font-size:14px; color:var(--sub); margin-left:4px}
.slider{-webkit-appearance:none; appearance:none; width:100%; height:3px; background:var(--paper-3); border-radius:3px; padding:0; border:0}
.slider::-webkit-slider-thumb{-webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--pine); border:3px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.25); cursor:pointer}
.slider:focus{box-shadow:none}
.drop{display:flex; align-items:center; gap:12px; border:1px dashed var(--paper-3); border-radius:12px; padding:13px 14px; background:#FCFBF6; cursor:pointer; margin-bottom:8px; transition:.15s}
.drop .box{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--paper-3);display:grid;place-items:center;font-size:11px;color:#fff}
.drop.on{border-style:solid; border-color:var(--pine); background:#fff}
.drop.on .box{background:var(--pine); border-color:var(--pine)}
.drop .t{font-size:12.5px; font-weight:600}
.drop .d{font-size:10.5px; color:var(--sub); margin-top:1px}
.drop .req{margin-left:auto; font-size:10px; color:var(--sub)}

.membercard{
  background:var(--pine); color:var(--paper); border-radius:20px; padding:22px; position:relative; overflow:hidden;
  box-shadow:0 18px 40px -18px rgba(11,31,23,.6);
}
.membercard::before{content:""; position:absolute; inset:0; background:repeating-linear-gradient(115deg, rgba(255,255,255,.03) 0 1px, transparent 1px 9px); pointer-events:none}
.membercard .top{display:flex; justify-content:space-between; align-items:flex-start}
.membercard .gname{font-family:'Barlow Condensed',sans-serif; letter-spacing:.28em; font-size:12px; color:var(--brass)}
.membercard .no{font-family:'Barlow Condensed',sans-serif; font-size:20px; letter-spacing:.14em; margin-top:16px}
.membercard .lbl{font-size:9.5px; letter-spacing:.18em; color:#7E9287; margin-top:2px}
.membercard .nm{font-family:'Noto Serif KR',serif; font-size:21px; font-weight:700; margin-top:18px; letter-spacing:-.01em}
.membercard .meta{display:flex; gap:18px; margin-top:14px; font-size:11px; color:#9FB3A7}
.membercard .seal{width:52px; height:52px; border-radius:50%; border:1px solid rgba(201,169,97,.5); display:grid; place-items:center; font-family:'Noto Serif KR',serif; font-size:19px; color:var(--brass); background:rgba(201,169,97,.08)}
.checklist{margin:18px 0 0; padding:0; list-style:none}
.checklist li{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px}
.checklist li:last-child{border:0}
.checklist .tick{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;background:var(--paper-3);color:#fff}
.checklist .tick.done{background:var(--pine)}
.checklist .tick.wait{background:transparent; border:1.5px dashed var(--paper-3); color:var(--sub)}
.checklist li span.s{margin-left:auto; font-size:11px; color:var(--sub)}

/* ---------- home ---------- */
.hero-grade{
  background:var(--pine); color:var(--paper); padding:20px 18px 22px; position:relative; overflow:hidden;
}
.hero-grade::after{
  content:""; position:absolute; right:-60px; top:-60px; width:230px; height:230px; border-radius:50%;
  border:1px solid rgba(201,169,97,.22);
}
.hero-grade .row1{display:flex; justify-content:space-between; align-items:flex-start; position:relative; z-index:1}
.hero-grade .gl{display:flex; align-items:flex-end; gap:12px}
.hero-grade .letter{font-family:'Noto Serif KR',serif; font-size:58px; line-height:.9; font-weight:900; letter-spacing:-.04em}
.hero-grade .letter.cA{color:var(--brass)} .hero-grade .letter.cB{color:#8FCBB0} .hero-grade .letter.cC{color:#9FB8D8} .hero-grade .letter.cD{color:#C7BCA8}
.hero-grade .subj{font-size:11px; color:#9FB3A7; line-height:1.6; padding-bottom:4px}
.hero-grade .hc{text-align:right}
.hero-grade .hc .v{font-family:'Barlow Condensed',sans-serif; font-size:40px; line-height:1; letter-spacing:.01em}
.hero-grade .hc .l{font-size:9.5px; letter-spacing:.16em; color:#7E9287; margin-top:3px}
.hero-grade .no2{font-family:'Barlow Condensed',sans-serif; font-size:11px; letter-spacing:.16em; color:var(--brass); margin-top:12px}
.promo-band{
  margin:16px 18px 0; border:1px solid var(--line); border-radius:14px; background:#fff; padding:14px 16px;
}
.promo-band .top{display:flex; justify-content:space-between; align-items:baseline}
.promo-band .top b{font-size:12.5px}
.promo-band .top span{font-family:'Barlow Condensed',sans-serif; font-size:12px; color:var(--sub); letter-spacing:.04em}
.track{height:5px; border-radius:5px; background:var(--paper-3); margin-top:10px; overflow:hidden}
.track > i{display:block; height:100%; background:linear-gradient(90deg,var(--pine),var(--brass)); border-radius:5px; transition:width .8s cubic-bezier(.2,.8,.2,1)}
.promo-band .note{font-size:10.5px; color:var(--sub); margin-top:8px}
.stat3{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin:16px 18px 0}
.stat3 > div{background:#fff; padding:13px 12px}
.stat3 .k{font-size:9.5px; color:var(--sub); letter-spacing:.06em}
.stat3 .v{font-family:'Barlow Condensed',sans-serif; font-size:23px; margin-top:3px; letter-spacing:.02em}
.stat3 .v small{font-size:10px; color:var(--sub); font-family:'Pretendard Variable'; letter-spacing:0}

.sec{padding:0 18px; margin-top:26px}
.sec-h{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:11px}
.sec-h h3{font-size:13px; font-weight:700; margin:0; letter-spacing:-.01em}
.sec-h .more{font-size:11px; color:var(--sub); background:none; border:0; font-family:inherit; cursor:pointer}

.rrow{display:flex; align-items:center; gap:13px; padding:13px 0; border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow .dt{width:40px; flex:0 0 40px; text-align:center}
.rrow .dt b{display:block; font-family:'Barlow Condensed',sans-serif; font-size:19px; line-height:1; letter-spacing:.02em}
.rrow .dt span{font-size:9px; color:var(--sub); letter-spacing:.06em}
.rrow .body{flex:1; min-width:0}
.rrow .body b{display:block; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rrow .body span{font-size:11px; color:var(--sub)}
.rrow .sc{text-align:right}
.rrow .sc b{font-family:'Barlow Condensed',sans-serif; font-size:24px; line-height:1}
.rrow .sc span{display:block; font-size:10px; color:var(--sub); margin-top:2px}
.birdie{color:var(--red); font-weight:700}

.pending-card{border:1px solid rgba(201,169,97,.45); background:linear-gradient(180deg,#FFFDF6,#fff); border-radius:14px; padding:14px 16px; margin:0 18px}
.pending-card .t{font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px}
.pending-card .d{font-size:11px; color:var(--sub); margin-top:4px; line-height:1.55}

/* ---------- ranking ---------- */
.rank-head{padding:18px 18px 0; background:var(--pine); color:var(--paper); padding-bottom:0}
.rank-head .h{display:flex; justify-content:space-between; align-items:flex-end}
.rank-head h2{font-family:'Noto Serif KR',serif; font-size:22px; margin:0; letter-spacing:-.03em; font-weight:700}
.rank-head .season{font-family:'Barlow Condensed',sans-serif; font-size:11px; letter-spacing:.1em; color:var(--brass); border:1px solid rgba(201,169,97,.35); padding:3px 8px; border-radius:999px}
.rank-head p{font-size:11px; color:#8FA396; margin:8px 0 0; line-height:1.6}
.tabs-scroll{display:flex; gap:7px; overflow-x:auto; padding:16px 18px 16px; scrollbar-width:none; background:var(--pine)}
.tabs-scroll::-webkit-scrollbar{display:none}
.tabs-scroll button{
  flex:0 0 auto; border:1px solid rgba(255,255,255,.16); background:transparent; color:#9FB3A7;
  font-family:inherit; font-size:12px; font-weight:600; padding:7px 13px; border-radius:999px; cursor:pointer; white-space:nowrap;
  display:flex; align-items:center; gap:6px;
}
.tabs-scroll button small{font-family:'Barlow Condensed',sans-serif; font-size:10px; opacity:.65}
.tabs-scroll button.on{background:var(--paper); color:var(--pine); border-color:var(--paper)}
.rank-list{background:var(--paper); padding:6px 18px 96px}
.rk{display:grid; grid-template-columns:30px 1fr auto; gap:12px; align-items:center; padding:13px 0; border-bottom:1px solid var(--line)}
.rk .pos{font-family:'Barlow Condensed',sans-serif; font-size:16px; color:var(--sub); text-align:center}
.rk .pos.top{color:var(--pine); font-weight:700}
.rk .nm{font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:6px}
.rk .nm .g{font-family:'Barlow Condensed',sans-serif; font-size:10px; width:15px; height:15px; border-radius:3px; display:grid; place-items:center; color:#fff; font-weight:700}
.rk .nm .g.A{background:var(--brass)} .rk .nm .g.B{background:#3E7F62} .rk .nm .g.C{background:#5C7A9E} .rk .nm .g.D{background:#96866E}

/* ---------- toast / banner ---------- */
.toast{position:absolute; left:16px; right:16px; bottom:86px; background:rgba(11,31,23,.96); color:var(--paper); padding:13px 16px; border-radius:12px; font-size:12.5px; line-height:1.5; opacity:0; transform:translateY(10px); transition:.28s; pointer-events:none; z-index:40; box-shadow:0 12px 30px rgba(0,0,0,.3)}
.toast.on{opacity:1; transform:none}
.promo-banner{
  margin:0; background:linear-gradient(135deg,#123A2E,#0B1F17); color:var(--paper); padding:26px 20px 24px; text-align:center; position:relative; overflow:hidden;
}
.promo-banner .eyebrow{color:var(--brass)}

.confetti i{position:absolute; width:5px; height:5px; background:var(--brass); opacity:.7; animation:fall 2.6s linear infinite}
@keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(320px) rotate(220deg); opacity:0}}
.delta{display:flex; align-items:baseline; justify-content:center; gap:10px; margin-top:14px}

.fade{animation:fade .32s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

<script>
/* ============================================================
   GREENFIELD — 운영용 클라이언트
   인증: Supabase Auth (이메일 확인)
   쓰기: 전부 RPC (핸디·승인·확정은 서버 계산)
   ============================================================ */
const PAR = [4,4,5,3,4,4,3,5,4, 4,3,4,4,5,4,3,5,4];
const CKEY = 'gf.cloud.v2';
const LS = { get(k){ try{return localStorage.getItem(k);}catch(e){return null;} },
             set(k,v){ try{localStorage.setItem(k,v);}catch(e){} },
             del(k){ try{localStorage.removeItem(k);}catch(e){} } };
const $ = (s,r=document)=>r.querySelector(s);
const fmt = n => (Math.round(Number(n)*10)/10).toFixed(1);
const GT = { A:'~10', B:'11–18', C:'19–27', D:'28~' };

function gradeOf(h){ const n=Math.round(Number(h)); return n<=10?'A':n<=18?'B':n<=27?'C':'D'; }
function nextGradeInfo(h){
  h=Number(h); const g=gradeOf(h);
  if(g==='A') return {next:'A',need:0,pct:100,top:true};
  const ceil={B:10.5,C:18.5,D:27.5}[g], floor={B:18.5,C:27.5,D:36.5}[g];
  return { next:{B:'A',C:'B',D:'C'}[g], need:Math.max(0,h-ceil),
           pct:Math.max(4,Math.min(100,(floor-h)/(floor-ceil)*100)) };
}

const A = {
  tab:'home', view:'lobby', cfg:null, sb:null, session:null, profile:null,
  round:null, players:[], scores:[], logs:[], rank:[], rankGrade:null,
  sel:1, busy:false, err:'', authMode:'login', emailSent:false, sum:null,
  conn:'', confirming:false
};

let tTimer;
function toast(m){
  const el=$('#toast'); if(!el) return;
  el.textContent=m; el.classList.add('on');
  clearTimeout(tTimer); tTimer=setTimeout(()=>el.classList.remove('on'),2800);
}

/* ---------------- 인증 ---------------- */
function authMsg(m){
  const s=(m||'').toLowerCase();
  if(s.includes('invalid login')) return '이메일 또는 비밀번호가 맞지 않습니다.';
  if(s.includes('email not confirmed')) return '이메일 인증이 아직 완료되지 않았습니다. 받은 메일의 링크를 눌러주세요.';
  if(s.includes('already registered')) return '이미 가입된 이메일입니다. 로그인해 주세요.';
  if(s.includes('password should be')) return '비밀번호는 6자 이상이어야 합니다.';
  if(s.includes('rate limit')) return '요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.';
  return m || '오류가 발생했습니다.';
}
async function doAuth(){
  const email=($('#a-email').value||'').trim();
  const pw=($('#a-pw').value||'');
  A.err='';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { A.err='이메일 형식을 확인해 주세요.'; render(); return; }
  if(pw.length<6) { A.err='비밀번호는 6자 이상이어야 합니다.'; render(); return; }
  A.busy=true; render();
  try{
    if(A.authMode==='signup'){
      const { data, error } = await A.sb.auth.signUp({ email, password:pw });
      if(error) throw error;
      if(!data.session){ A.emailSent=true; A.emailUsed=email; }
      else { A.session=data.session; await loadProfile(); }
    } else {
      const { data, error } = await A.sb.auth.signInWithPassword({ email, password:pw });
      if(error) throw error;
      A.session=data.session; await loadProfile();
    }
  } catch(e){ A.err=authMsg(e.message); }
  A.busy=false; render();
}
async function loadProfile(){
  if(!A.sb || !A.session) return;
  const { data } = await A.sb.from('gf_profiles').select('*').eq('id',A.session.user.id).maybeSingle();
  A.profile = data || null;
  if(A.profile) await loadHistory();
}
async function loadHistory(){
  const { data } = await A.sb.from('gf_round_results')
    .select('gross,diff,created_at,round_id,gf_rounds(course,code,confirmed_at)')
    .eq('user_id', A.session.user.id).order('created_at',{ascending:false}).limit(6);
  A.logs = data || [];
}
async function createProfile(){
  const name=($('#o-name').value||'').trim();
  const region=$('#o-region').value;
  const hcp=parseFloat($('#o-hcp').value);
  A.err='';
  if(name.length<2){ A.err='이름을 2자 이상 입력해 주세요.'; render(); return; }
  if(!(hcp>=0 && hcp<=54)){ A.err='핸디는 0~54 사이로 입력해 주세요.'; render(); return; }
  A.busy=true; render();
  const { error } = await A.sb.from('gf_profiles').insert({ id:A.session.user.id, name, region, hcp });
  A.busy=false;
  if(error){ A.err=authMsg(error.message); render(); return; }
  await loadProfile(); A.tab='home'; render();
  toast('회원번호가 발급되었습니다. 확정 5라운드 전까지는 루키입니다.');
}
async function logout(){
  await A.sb.auth.signOut();
  A.session=null; A.profile=null; A.round=null; A.tab='home'; A.view='lobby'; render();
}

/* ---------------- 랭킹 ---------------- */
async function loadRank(grade){
  const { data, error } = await A.sb.rpc('gf_leaderboard', { p_grade: grade||null, p_limit: 60 });
  if(error){ toast(error.message); return; }
  A.rank = data || [];
}
async function openRank(grade){
  if(grade!==undefined) A.rankGrade=grade;
  A.tab='rank';
  await loadRank(A.rankGrade);
  render();
}

/* ---------------- 라운드 ---------------- */
async function createRound(course){
  A.err=''; A.busy=true; render();
  const { data, error } = await A.sb.rpc('gf_create_round', { p_course: course, p_par: 72 });
  A.busy=false;
  if(error){ A.err=error.message; render(); return; }
  A.round=Array.isArray(data)?data[0]:data;
  A.players=[]; A.scores=[]; A.sel=1; A.sum=null;
  await loadBoard();
  subscribe();
  A.tab='live'; A.view='board'; render();
  toast('라운드를 열었습니다. 코드 '+A.round.code);
}
async function joinRound(code){
  A.err=''; A.busy=true; render();
  const { data, error } = await A.sb.rpc('gf_join_round', { p_code: code });
  A.busy=false;
  if(error){ A.err=error.message; render(); return; }
  A.round=Array.isArray(data)?data[0]:data;
  A.players=[]; A.scores=[]; A.sel=1; A.sum=null;
  await loadBoard();
  subscribe();
  A.tab='live'; A.view='board'; render();
}
async function loadBoard(){
  if(!A.round) return;
  const rid=A.round.id;
  const [pl, sc] = await Promise.all([
    A.sb.from('gf_round_players').select('*').eq('round_id',rid).order('joined_at'),
    A.sb.from('gf_scores').select('*').eq('round_id',rid)
  ]);
  A.players = pl.data || [];
  A.scores  = sc.data || [];
  A.sel = nextHole();
  render();
  maybeConfirm();
}
function subscribe(){
  if(!A.sb || !A.round) return;
  if(A.ch){ try{ A.sb.removeChannel(A.ch); }catch(e){} }
  const rid=A.round.id; A.conn='wait';
  A.ch = A.sb.channel('gf-'+rid)
    .on('postgres_changes',{event:'*',schema:'public',table:'gf_scores',filter:'round_id=eq.'+rid},()=>loadBoard())
    .on('postgres_changes',{event:'*',schema:'public',table:'gf_round_players',filter:'round_id=eq.'+rid},()=>loadBoard())
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'gf_rounds',filter:'id=eq.'+rid},(p)=>{
      if(p.new && p.new.status==='confirmed' && A.round.status!=='confirmed'){
        A.round.status='confirmed'; render();
      }
    })
    .subscribe(st=>{ A.conn = st==='SUBSCRIBED'?'on':(st==='CHANNEL_ERROR'||st==='TIMED_OUT')?'off':'wait'; render(); });
}

const meId = () => A.session ? A.session.user.id : null;
const scoresOf = uid => A.scores.filter(s=>s.user_id===uid).sort((a,b)=>a.hole-b.hole);
const thru = uid => scoresOf(uid).length;
const grossOf = uid => scoresOf(uid).reduce((a,s)=>a+s.strokes,0);
const toParOf = uid => scoresOf(uid).reduce((a,s)=>a+s.strokes-s.par,0);
const scored = (uid,h) => A.scores.find(s=>s.user_id===uid && s.hole===h);
const parFmt = n => n===0?'E':n>0?'+'+n:'−'+Math.abs(n);
function nextHole(){
  const uid=meId(); if(!uid) return 1;
  for(let h=1;h<=18;h++) if(!scored(uid,h)) return h;
  return 19;
}
function liveSel(h){ A.sel=h; render(); }
async function submitScore(delta){
  if(!A.round || A.round.status!=='live') return;
  const h=A.sel; if(h>18) return;
  const strokes=PAR[h-1]+delta;
  const { error } = await A.sb.rpc('gf_submit_score',{ p_round:A.round.id, p_hole:h, p_strokes:strokes });
  if(error){ toast(error.message); return; }
  await loadBoard();
  toast(h+'번홀 '+strokes+'타 · 동기화');
}
async function approveRound(){
  const { data, error } = await A.sb.rpc('gf_approve',{ p_round:A.round.id });
  if(error){ toast(error.message); return; }
  await loadBoard();
  toast('승인했습니다. 현재 '+data+'/2');
}
function okApprovals(){
  if(!A.round) return 0;
  return A.players.filter(p=>p.user_id!==A.round.host_id && p.approved_at).length;
}
function allDone(){ return A.players.length>=2 && A.players.every(p=>thru(p.user_id)>=18); }
async function maybeConfirm(){
  if(!A.round || A.round.status!=='live' || A.confirming) return;
  if(okApprovals()<2 || !allDone()) return;
  A.confirming=true;
  try{
    const { data, error } = await A.sb.rpc('gf_confirm_round',{ p_round:A.round.id });
    if(error) throw error;
    const mine=(data && data.players || []).find(p=>p.user_id===meId());
    A.round.status='confirmed';
    A.sum = mine ? { ...mine, course:A.round.course, code:A.round.code } : null;
    await loadProfile();
    A.tab='live'; A.view='sum'; render();
  }catch(e){ /* 조건 미충족은 조용히 무시 */ }
  A.confirming=false;
}

/* ---------------- 렌더 ---------------- */
const ICO = {
  home:'<svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>',
  rank:'<svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
  live:'<svg viewBox="0 0 24 24"><path d="M3 12h3.2l2.3-6 3.6 12 2.4-6H21"/></svg>',
  me:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20c.7-3.9 3.5-6 7.2-6s6.5 2.1 7.2 6"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>'
};
function screenName(){
  if(!A.sb) return 'needconfig';
  if(A.emailSent) return 'sent';
  if(!A.session) return 'auth';
  if(!A.profile) return 'onboard';
  if(A.tab==='rank') return 'rank';
  if(A.tab==='me') return 'me';
  if(A.tab==='live') return A.view==='board'?'board':A.view==='sum'?'sum':'lobby';
  return 'home';
}
function render(){
  const sc=screenName();
  const loggedIn = !!A.session && !!A.profile;
  const bar=$('#appbar'), tabs=$('#tabbar'), scr=$('#screen');
  if(!scr) return;

  if(['auth','sent','onboard','needconfig'].includes(sc)){
    bar.style.display='none'; tabs.style.display='none';
  } else {
    bar.style.display='flex'; tabs.style.display='grid';
    bar.innerHTML=appbar(sc); tabs.innerHTML=tabbar();
  }
  const changed=scr.dataset.sc!==sc, keep=scr.scrollTop;
  scr.dataset.sc=sc;
  scr.innerHTML=({needconfig:viewNeedConfig,auth:viewAuth,sent:viewSent,onboard:viewOnboard,
    home:viewHome,rank:viewRank,lobby:viewLobby,board:viewBoard,sum:viewSum,me:viewMe})[sc]();
  scr.scrollTop = changed?0:keep;
}
function appbar(sc){
  const t={home:'내 등급',rank:'전국 랭킹',lobby:'라이브 라운드',board:'라이브 스코어',sum:'라운드 확정',me:'내 정보'}[sc]||'';
  return `<div style="flex:1">
      <div class="ttl">GREENFIELD · ${t}</div>
      <div class="who"><span class="nm">${A.profile.name}</span><span class="no">${A.profile.member_no}</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      ${A.round&&A.round.status==='live'?`<span class="sync ${A.conn==='on'?'on':'wait'}"><i></i>${A.conn==='on'?'SYNC':'연결'}</span>`:''}
      <button class="ic" onclick="openRank()" aria-label="랭킹">${ICO.rank}</button>
    </div>`;
}
function tabbar(){
  const items=[['home','홈',ICO.home],['rank','랭킹',ICO.rank],['live','라이브',ICO.live],['me','내 정보',ICO.me]];
  return items.map(([k,l,i])=>`<button class="${A.tab===k?'on':''}" onclick="goTab('${k}')">${i}<span>${l}</span></button>`).join('');
}
function goTab(k){
  A.tab=k;
  if(k==='rank'){ openRank(); return; }
  render();
}

function saveCfg(){
  const url=($('#c-url').value||'').trim().replace(/\/+$/,'');
  const key=($('#c-key').value||'').trim();
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){ toast('URL 형식을 확인해 주세요.'); return; }
  if(key.length<20){ toast('공개 키를 정확히 붙여넣어 주세요.'); return; }
  LS.set(CKEY, JSON.stringify({url,key}));
  A.cfg={url,key};
  A.sb=window.supabase.createClient(url,key);
  A.sb.auth.getSession().then(({data})=>{ A.session=data.session; if(A.session) return loadProfile(); }).then(()=>render());
  A.sb.auth.onAuthStateChange((_e,s)=>{ A.session=s; if(s) loadProfile().then(render); else render(); });
  render();
}

      <div><b>${A.round.course} · ${thru(meId())}홀</b><span>코드 ${A.round.code} · 보드 열기</span></div></div>`:''}
  <div class="sec">
    <div class="sec-h"><h3>최근 라운드</h3></div>
    ${A.logs.length?A.logs.map(l=>{
      const d=new Date(l.created_at), g0=gradeOf(Number(l.diff));
      return `<div class="rrow">
        <div class="dt"><b>${d.getDate()}</b><span>${d.getMonth()+1}월</span></div>
        <div class="body"><b>${l.gf_rounds?l.gf_rounds.course:'라운드'}</b><span>그로스 ${l.gross} · 파대비 ${parFmt(Number(l.diff))}</span></div>
        <div class="sc"><b>${l.gross}</b><span>${g0}등급</span></div>
      </div>`;}).join(''):'<p class="muted" style="padding:8px 0">아직 확정된 라운드가 없습니다.</p>'}
    <button class="btn" style="margin-top:14px" onclick="A.tab='live';A.view='lobby';render()">라운드 열기 · 코드로 참여</button>
  </div>`;
}
function viewRank(){
  const tabs=[['ALL','전체'],['A','A'],['B','B'],['C','C'],['D','D']];
  const rows=A.rank||[];
  const myIdx=rows.findIndex(r=>r.user_id===meId());
  return `<div class="rank-head">
    <div class="h"><h2>전국 랭킹</h2><span class="season">${A.rankGrade||'ALL'} · ${rows.length}명</span></div>
    <p>핸디 → 확정 라운드 순. 루키(확정 5회 미만)는 별도 표시됩니다.</p>
  </div>
  <div class="tabs-scroll">${tabs.map(([k,l])=>`<button class="${(A.rankGrade||'ALL')===k?'on':''}" onclick="openRank('${k==='ALL'?'':k}')">${l}</button>`).join('')}</div>
  <div class="rank-list" style="padding-top:8px">
    ${rows.length?rows.map(r=>`<div class="rk ${r.user_id===meId()?'me':''}">
      <div class="pos ${Number(r.rank)<=3?'top':''}">${r.rank}</div>
      <div>
        <div class="nm"><span class="g ${r.grade}">${r.grade}</span>${r.name}${r.user_id===meId()?' <span class="chip gold" style="padding:1px 6px;font-size:9px">나</span>':''}</div>
        <div class="mt"><span>${r.region}</span><span>${r.rounds}R</span>${r.status==='rookie'?'<span>루키</span>':''}</div>
      </div>
      <div class="hc">${fmt(r.hcp)}<span>핸디</span></div>
    </div>`).join(''):'<p class="muted" style="padding:18px 0">아직 집계된 회원이 없습니다.</p>'}
  </div>
  <div class="myrank" style="position:sticky;bottom:0">
    <div class="pos">${myIdx>=0?myIdx+1:'—'}<small>위</small></div>
    <div class="who"><b>${A.profile.name} · ${gradeOf(A.profile.hcp)}등급</b>핸디 ${fmt(A.profile.hcp)} · ${A.profile.rounds}R</div>
    <button class="go" onclick="openRank()">새로고침</button>
  </div>`;
}
function viewLobby(){
  if(A.round && A.round.status==='live'){
    return `<div class="lobby">
      <div class="eyebrow">ROUND IN PROGRESS</div>
      <h2 class="h1" style="margin-top:8px">${A.round.course}</h2>
      <div class="coderow" style="margin-top:16px"><b>${A.round.code}</b><span>조원에게<br>불러주세요</span>
        <button onclick="copyCode('${A.round.code}')">복사</button></div>
      <div class="lpanel">
        <h3>참여 ${A.players.length}/4</h3>
        <p>같은 코드로 들어오면 실시간으로 추가됩니다.</p>
        ${A.players.map(p=>`<div class="who2">
          <div class="av">${p.name[0]}</div>
          <div class="n">${p.name}${p.user_id===meId()?' (나)':''}<small>핸디 ${fmt(p.hcp_at)} · ${p.user_id===A.round.host_id?'주최자':'참여'}</small></div>
          <div class="st ${p.approved_at?'ok':''}">${p.approved_at?'승인':'—'}</div>
        </div>`).join('')}
      </div>
      <button class="btn" onclick="A.view='board';render()">라이브 보드 열기</button>
      <button class="btn ghost" style="margin-top:10px" onclick="leaveRound()">라운드 나가기</button>
    </div>`;
  }
  return `<div class="lobby">
    <div class="eyebrow">START A ROUND</div>
    <h2 class="h1" style="margin-top:8px">같은 조, 같은 보드</h2>
    ${A.err?`<div class="err2 on" style="margin-top:14px">${A.err}</div>`:''}
    <div class="lpanel" style="margin-top:18px">
      <h3>새 라운드 열기</h3>
      <p>4자리 코드가 발급되고 내가 주최자가 됩니다.</p>
      <div class="pick-row" style="margin-bottom:12px">
        ${['베어즈베스트 청라','남서울CC','스카이72 오션','부여CC'].map((c,i)=>`<button class="pick ${i===0?'on':''}" onclick="pickCourse('${c}',this)">${c}<small>파72 · 18홀</small></button>`).join('')}
      </div>
      <button class="btn" ${A.busy?'disabled':''} onclick="createRound(window.__course||'베어즈베스트 청라')">${A.busy?'여는 중…':'라운드 열기'}</button>
    </div>
    <div class="lpanel">
      <h3>코드로 참여</h3>
      <p>조원에게 받은 4자리 코드.</p>
      <div class="codesheet">${[0,1,2,3].map(i=>`<input id="c${i}" maxlength="1" oninput="codeNext(${i})" aria-label="코드">`).join('')}</div>
      <button class="btn ghost" style="margin-top:10px" onclick="joinByInput()">참여하기</button>
    </div>
  </div>`;
}
function pickCourse(name, el){
  window.__course=name;
  Array.prototype.forEach.call(el.parentNode.children,c=>c.classList.remove('on'));
  el.classList.add('on');
}
function codeNext(i){
  const el=$('#c'+i); el.value=(el.value||'').toUpperCase();
  if(el.value && i<3) $('#c'+(i+1)).focus();
}
function joinByInput(){
  const c=[0,1,2,3].map(i=>($('#c'+i).value||'').toUpperCase()).join('');
  if(c.length!==4){ A.err='4자리 코드를 입력하세요.'; render(); return; }
  joinRound(c);
}
function copyCode(c){
  try{ navigator.clipboard.writeText(c); toast('코드 '+c+' 복사'); }catch(e){ toast('코드: '+c); }
}
function leaveRound(){
  if(A.ch&&A.sb){ try{ A.sb.removeChannel(A.ch); }catch(e){} }
  A.ch=null; A.round=null; A.players=[]; A.scores=[]; A.view='lobby'; render();
}
function viewBoard(){
  if(!A.round) return '<div class="lobby"><p class="muted">진행 중인 라운드가 없습니다.</p></div>';
  const uid=meId(), t=thru(uid), tp=toParOf(uid), g=grossOf(uid);
  const order=A.players.map(p=>({p,tp:toParOf(p.user_id),t:thru(p.user_id)}))
    .sort((a,b)=>(a.t-a.tp)-(b.t-b.tp)||b.t-a.t);
  const myPos=order.findIndex(o=>o.p.user_id===uid)+1;
  const h=A.sel>18?18:A.sel, par=PAR[h-1], done=t>=18;
  const ok=okApprovals(), isHost=A.round.host_id===uid, myP=A.players.find(p=>p.user_id===uid);
  return `<div class="live-hd">
    <div class="live-top"><span class="live-pill"><i></i>LIVE</span>
      <span class="num" style="font-family:'Barlow Condensed';letter-spacing:.14em">${A.round.code}</span>
      <span>${A.players.length}명 · ${t}/18</span><span style="margin-left:auto">${A.conn==='on'?'SYNC':'…'}</span></div>
    <div class="live-course">${A.round.course}</div>
    <div class="live-meta">파${A.round.par} · 18홀 · ${A.profile.name}</div>
    <div class="my-live"><div class="big">${parFmt(tp)}</div>
      <div class="side"><b>${g}타 · ${t}홀</b>조 내 ${myPos}위 / ${A.players.length}명</div></div>
  </div>
  <div class="lb"><div class="lb-cap"><span>조 리더보드</span><span>파 대비 · THRU</span></div>
    ${order.map((o,i)=>`<div class="r ${o.p.user_id===uid?'me':''}">
      <div class="p">${i+1}</div>
      <div><div class="nm">${o.p.name}${o.p.user_id===uid?' <span class="chip gold" style="padding:0 5px;font-size:8.5px">나</span>':''}<small>${fmt(o.p.hcp_at)}</small></div>
        <div class="chips-mini">${scoresOf(o.p.user_id).slice(-4).map(s=>`<i class="${s.strokes<s.par?'b':s.strokes>s.par?'d':''}">${s.strokes}</i>`).join('')}</div></div>
      <div class="to ${o.t-o.tp<0?'u':''}">${parFmt(o.t-o.tp)}<span>${o.t}홀</span></div>
    </div>`).join('')}</div>
  <div class="entry">
    <div class="entry-h"><b>${done?'18홀 완료':h+'번홀 · 파'+par}</b><span>${done?'승인 대기':'탭하면 즉시 동기화'}</span></div>
    ${done?'<div class="warn" style="margin-top:2px">내 입력은 끝났습니다. 전원 18홀 + 승인 2명이면 확정됩니다.</div>':`<div class="keys" style="margin-top:2px">
      <button onclick="submitScore(-1)">버디<small>−1</small></button>
      <button class="pri" onclick="submitScore(0)">파<small>기준</small></button>
      <button onclick="submitScore(1)">보기<small>+1</small></button>
      <button onclick="submitScore(2)">더블<small>+2</small></button></div>`}
    <div class="hstrip" style="margin-top:12px">${PAR.map((p0,i)=>{
      const s=scored(uid,i+1), hh=i+1;
      const cls=[hh===h?'sel':'',s?'done':'',s&&s.strokes<p0?'bd':''].join(' ');
      return `<button class="${cls}" onclick="liveSel(${hh})">${s?s.strokes:hh}</button>`;
    }).join('')}</div>
    <div class="entry-f"><span>이 홀 입력 ${A.players.filter(p=>scored(p.user_id,h)).length}/${A.players.length}</span><span>지난 홀은 번호 탭</span></div>
  </div>
  <div class="appr" style="margin:12px 18px 0">
    <div class="hd"><b>동반자 승인</b><span class="${ok>=2?'ok':''}">${ok} / 2</span></div>
    ${A.players.map(p=>{
      const mine=p.user_id===uid, host=p.user_id===A.round.host_id, ap=p.approved_at;
      return `<div class="p"><div class="av">${p.name[0]}</div>
        <div class="nm">${p.name}${mine?' (나)':''}<small>${host?'주최자':(ap?'승인 완료':'대기')}</small></div>
        ${host?'<span class="st">—</span>':ap?'<span class="st ok">승인</span>':
          mine?'<button onclick="approveRound()">내가 승인</button>':'<span class="st">대기</span>'}
      </div>`;}).join('')}
  </div>
  <div style="padding:14px 18px 24px">
    <button class="btn ghost" onclick="copyCode('${A.round.code}')">코드 ${A.round.code} 공유</button>
    <div class="inline-note" style="text-align:center">${isHost?'내가 주최자입니다.':'조원으로 참여 중입니다.'} 전원 18홀 + 승인 2명이면 자동 확정됩니다.</div>
  </div>`;
}
function viewSum(){
  const s=A.sum;
  if(!s) return `<div class="lobby"><p class="muted">확정 정보를 불러오지 못했습니다.</p>
    <button class="btn ghost" style="margin-top:12px" onclick="A.view='lobby';render()">돌아가기</button></div>`;
  const up=!!s.promoted;
  return `<div class="promo-banner">
    ${up?`<div class="confetti">${Array.from({length:12}).map((_,i)=>`<i style="left:${(i*8.3)%100}%; animation-delay:${(i%6)*.2}s"></i>`).join('')}</div>`:''}
    <div class="eyebrow">${up?'PROMOTED':'ROUND CONFIRMED'}</div>
    <div class="arrow">${up?`${s.grade_before||'—'} <span>→</span> ${s.grade}`:'확정'}</div>
    <h2>${up?s.grade+'등급으로 승급했습니다':'라운드가 확정되었습니다'}</h2>
    <div class="delta"><span class="b">${fmt(s.before)}</span><span class="a">${fmt(s.after)}</span><span class="u">핸디</span></div>
    <p>${s.course} · 그로스 ${s.gross}타 · 코드 ${s.code}<br>동반자 2명 승인 · 서버에서 재계산</p>
  </div>
  <div class="stat3" style="margin:18px 18px 0">
    <div><div class="k">그로스</div><div class="v">${s.gross}</div></div>
    <div><div class="k">파 대비</div><div class="v">${parFmt(s.gross-72)}</div></div>
    <div><div class="k">새 핸디</div><div class="v">${fmt(s.after)}</div></div>
  </div>
  <div style="padding:18px">
    <button class="btn" onclick="openRank('${s.grade}')">${s.grade}등급 랭킹 보기</button>
    <button class="btn ghost" style="margin-top:10px" onclick="leaveRound();A.tab='live';render()">새 라운드</button>
  </div>`;
}
function viewMe(){
  const p=A.profile;
  return `<div class="me-hd">
    <div class="nm">${p.name}</div>
    <div class="meta">${p.member_no} · ${p.region} · ${gradeOf(p.hcp)}등급</div>
    <div style="display:flex;gap:18px;margin-top:16px;font-size:11px;color:#9FB3A7">
      <span>핸디 <b style="color:var(--paper);font-size:13px">${fmt(p.hcp)}</b></span>
      <span>확정 <b style="color:var(--paper);font-size:13px">${p.rounds}R</b></span>
      <span>${p.status==='active'?'정회원':'루키'}</span>
    </div>
  </div>
  <div class="sec" style="margin-top:20px"><div class="sec-h"><h3>등급 기준</h3></div></div>
  <div style="margin:0 18px" class="card">
    <table class="rule-table"><tr><th>등급</th><th>핸디</th><th>인원</th></tr>
      ${['A','B','C','D'].map(k=>`<tr style="${gradeOf(p.hcp)===k?'background:rgba(201,169,97,.09)':''}">
        <td><span class="badge-grade" style="background:${{A:'#C9A961',B:'#3E7F62',C:'#5C7A9E',D:'#96866E'}[k]}">${k}</span>${GT[k]}</td>
        <td>${k==='A'?'10 이하':k==='B'?'11–18':k==='C'?'19–27':'28 이상'}</td>
        <td>${A.rank.filter(r=>r.grade===k).length||'-'}</td></tr>`).join('')}
    </table>
  </div>
  <div class="sec" style="margin-top:22px"><div class="sec-h"><h3>핸디 이력</h3><span style="font-size:10px;color:var(--sub)">서버 기록</span></div></div>
  <div class="list">
    ${A.logs&&A.logs.length?A.logs.slice(0,4).map(l=>`<div style="display:flex;padding:13px 16px;border-bottom:1px solid var(--line);align-items:center">
      <div style="flex:1"><div style="font-size:12.5px;font-weight:600">${l.gf_rounds?l.gf_rounds.course:'라운드'}</div>
      <div style="font-size:10.5px;color:var(--sub);margin-top:2px">${new Date(l.created_at).toLocaleDateString('ko-KR')} · ${l.gross}타</div></div>
      <div style="font-family:'Barlow Condensed';font-size:13px;color:var(--sub)">${parFmt(Number(l.diff))}</div>
    </div>`).join(''):'<div style="padding:14px 16px;font-size:12px;color:var(--sub)">아직 기록이 없습니다.</div>'}
  </div>
  <div class="sec" style="margin-top:22px"><div class="sec-h"><h3>계정</h3></div></div>
  <div class="list">
    <button onclick="toast('로그인 이메일: '+(A.session?A.session.user.email:''))"><span class="k">로그인 계정</span><span class="v">${A.session?A.session.user.email:''}</span></button>
    <button onclick="toast('라운드는 전원 18홀 + 승인 2명이면 확정됩니다.')"><span class="k">확정 규칙</span><span class="v">승인 2명</span></button>
    <button onclick="logout()"><span class="k" style="color:var(--red)">로그아웃</span></button>
  </div>
  <div style="padding:20px 18px;text-align:center;font-size:10px;color:var(--sub)">GREENFIELD 2.0 · Supabase Realtime</div>`;
}

/* ---------------- boot ---------------- */
(function boot(){
  const g=window.GF_CONFIG||{};
  A.cfg = (g.url&&g.key) ? {url:g.url,key:g.key} : (LS.get(CKEY)?JSON.parse(LS.get(CKEY)):null);
  if(A.cfg && window.supabase){
    A.sb = window.supabase.createClient(A.cfg.url, A.cfg.key);
    A.sb.auth.getSession().then(({data})=>{
      A.session=data.session;
      return A.session ? loadProfile() : null;
    }).then(()=>render());
    A.sb.auth.onAuthStateChange((_e,s)=>{
      A.session=s;
      if(s) loadProfile().then(render); else render();
    });
  }
  render();
  if('serviceWorker' in navigator && location.protocol==='https:'){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();

</script>
</body>
</html>
